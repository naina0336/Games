
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scratch Game</title>

    <link rel="icon" href="favicon.ico">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            text-align: center;
            color: #333;
        }

        header {
            background: #6c63ff;
            color: white;
            padding: 25px;
        }

        .game-container {
            margin: 40px auto;
            padding: 20px;
        }

        iframe {
            max-width: 100%;
            border: 5px solid white;
            border-radius: 15px;
        }

        .back-button {
            display: inline-block;
            background: #6c63ff;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            margin: 20px;
        }

        footer {
            padding: 20px;
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Scratch Game</h1>
        <p>Play my game and have fun!</p>
    </header>

    <div class="game-container">

        <h2>Let's Play!</h2>

        <iframe
            src="https://scratch.mit.edu/projects/1444598756/embed"
            allowtransparency="true"
            width="485"
            height="402"
            frameborder="0"
            scrolling="no"
            allowfullscreen>
        </iframe>

        <br>

        <a href="index.html" class="back-button">
            Back to Home
        </a>

    </div>

    <footer>
        <p>Made with creativity and coding!</p>
    </footer>

</body>
</html>
